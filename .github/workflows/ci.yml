name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Requirement-ID parity (AC-011)
        run: node scripts/check-id-sets.cjs
      - name: Deterministic tests, hygiene and manifest agreement
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap tests/ttak.test.cjs 2>&1 | tee /tmp/suite.log
      - name: No skipped assertions
        run: grep -qE '^. skipped 0$' /tmp/suite.log
      - name: Cross-host conformance selftest
        run: python3 tests/conformance/run.py --selftest
