name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
      - name: Requirement-ID parity (AC-011)
        run: node scripts/check-id-sets.cjs
      - name: Complete offline suites, hygiene and zero skipped assertions
        env:
          TTAK_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/test-local.cjs
